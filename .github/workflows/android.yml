name: Android

# Baut die Android-App (APK) aus der Web-App, inklusive Beispiel-Log mit verschobener GPS-Spur.
# Die APK liegt danach als Artefakt beim Workflow-Lauf (Actions), es wird nichts veröffentlicht.
on:
  push:
    paths:
      - 'android/**'
      - 'capacitor.config.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      # ohne Install-Skripte: Electron wird hier nicht gebraucht
      - run: npm install --ignore-scripts
      - run: npm run build-android
      - run: ./gradlew assembleRelease --no-daemon
        working-directory: android
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - run: cp android/app/build/outputs/apk/release/app-release.apk "MM-Flight-Analyzer-${{ steps.v.outputs.version }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: MM-Flight-Analyzer-Android-${{ steps.v.outputs.version }}
          path: MM-Flight-Analyzer-*.apk
          if-no-files-found: error
